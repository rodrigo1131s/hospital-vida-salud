server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// = el Gateway pregunta a Eureka por la instancia del servicio
        - id: pacientes
          uri: lb://pacientes-service
          predicates:
            - Path=/api/pacientes/**
        - id: citas
          uri: lb://citas-service
          predicates:
            - Path=/api/citas/**
        - id: notificaciones
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/notificaciones/**
        - id: auditoria
          uri: lb://auditoria-service
          predicates:
            - Path=/api/auditoria/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
